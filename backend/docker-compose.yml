services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://reviewtap:reviewtap@db:5432/reviewtap
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: reviewtap
      POSTGRES_PASSWORD: reviewtap
      POSTGRES_DB: reviewtap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: